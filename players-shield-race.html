$('#chart').innerHTML=`<svg viewBox="0 0 1190 710" role="group" aria-label="${rankMode?'Rank':'Cumulative points'} through ${fmt(w.date)}"><text x="8" y="22">${rankMode?'RANK':'POINTS'}</text>${ticks.map(v=>{const yy=rankMode?y({rank:v}):y({points:v});return `<line x1="${left}" y1="${yy}" x2="${right}" y2="${yy}" stroke="#dce1d9"/><text x="36" y="${yy+4}" text-anchor="end">${v}</text>`}).join('')}${weeks.map((w,i)=>i%4===0||i===weeks.length-1?`<text x="${x(i)}" y="690" text-anchor="middle">W${i+1}</text>`:'').join('')}<line x1="${x(index)}" y1="${top}" x2="${x(index)}" y2="${bottom}" stroke="#618d18" stroke-dasharray="4 4"/>${teams.map((t,ti)=>{const vals=weeks.slice(0,index+1).map((week,i)=>({i,row:week.rows.find(r=>r.team===t.id)})),last=vals.at(-1).row;return `<g data-team="${t.id}"><path d="${vals.map((v,i)=>(i?'L':'M')+x(v.i)+' '+y(v.row)).join(' ')}" fill="none" stroke="${teamColors[t.id]}" stroke-width="2.3" opacity=".9"/><circle cx="${x(index)}" cy="${y(last)}" r="3" fill="${teamColors[t.id]}"/><title>Players Shield race</title></g>`}).join('')}<text x="902" y="22">CLUB</text><text x="1110" y="22" text-anchor="end">PTS</text><text x="1160" y="22" text-anchor="end">GP</text>${ordered.map((r,i)=>{const t=teams.find(t=>t.id===r.team),yy=top+(bottom-top)*i/24;return `<g data-team="${t.id}"><path d="M${x(index)+7} ${y(r)} L875 ${yy}" fill="none" stroke="#bbc4c9" opacity=".35"/><text x="892" y="${yy+4}" class="club">${r.rank}</text><image href="${t.logo}" x="920" y="${yy-12}" width="24" height="24"/><text x="956" y="${yy+4}" class="club">${esc(t.code)}</text><text x="1110" y="${yy+4}" text-anchor="end" class="club">${r.points}</text><text x="1160" y="${yy+4}" text-anchor="end">${r.gp}</text><title>Players Shield race</title></g>`}).join('')}</svg>`;
focusClub(selectedClubs);}
$('#week').addEventListener('input',render);$('#prev').onclick=()=>{$('#week').value=Math.max(0,index-1);render()};$('#next').onclick=()=>{$('#week').value=Math.min(weeks.length-1,index+1);render()};$('#chart').addEventListener('pointerover',e=>{if(selectedClubs.size===0){const t=e.target.closest('[data-team]');if(t)focusClub(new Set([t.dataset.team]))}});$('#chart').addEventListener('pointerleave',()=>focusClub(selectedClubs));render();
</script></body></html>
